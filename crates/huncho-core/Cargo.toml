[package]
name = "huncho-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
subtle.workspace = true
indexmap = { version = "2", features = ["serde"] }

# Native tokenization retains the current Oniguruma/C++ feature choices.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { version = "0.20", optional = true }

# Browser builds have their own regex/runtime profile and require independent
# tokenization/output qualification. Native builds never select this path.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokenizers = { version = "0.20", optional = true, default-features = false, features = ["unstable_wasm"] }

[features]
default = []
tokenizers = ["dep:tokenizers"]
external-scores = []
