[package]
name = "huncho-backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
huncho-core = { path = "../huncho-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true

ort = { version = "2.0.0-rc.13", optional = true, default-features = false, features = ["ndarray", "std", "download-binaries", "tls-native"] }
# candle: Hugging Face's own Rust framework. Loads HF `safetensors` directly, so
# real HF models (e.g. ModernBERT) can be served without an ONNX export or a
# Python/optimum toolchain. This is the primary real-model path for F1.
candle = { package = "candle-core", version = "0.11", optional = true, default-features = false }
candle-nn = { version = "0.11", optional = true, default-features = false }
candle-transformers = { version = "0.11", optional = true, default-features = false }
zip = { version = "8.6", optional = true, default-features = false }

[features]
default = []
onnx = ["dep:ort"]
candle = ["dep:candle", "dep:candle-nn", "dep:candle-transformers", "dep:zip"]
clef = ["candle", "huncho-core/tokenizers"]
cuda = ["clef", "candle/cuda", "candle-nn/cuda"]

[dev-dependencies]
tempfile = "3"
anyhow.workspace = true
