[package]
name = "huncho-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "huncho"
path = "src/main.rs"

[[example]]
name = "laya_check"
required-features = ["candle", "tokenizers"]

[dependencies]
huncho-core = { path = "../huncho-core" }
huncho-backend = { path = "../huncho-backend" }
huncho-api = { path = "../huncho-api" }
huncho-hub = { path = "../huncho-hub", optional = true }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
log.workspace = true

[features]
default = []
onnx = ["huncho-backend/onnx"]
candle = ["huncho-backend/candle", "huncho-hub?/candle"]
hf = ["dep:huncho-hub"]
tokenizers = ["huncho-core/tokenizers"]

[dev-dependencies]
tempfile = "3"
