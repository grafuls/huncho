[package]
name = "huncho-browser-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.97"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
huncho-core = { path = "../../crates/huncho-core", features = ["tokenizers", "external-scores"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
