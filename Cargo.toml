[workspace]
resolver = "2"
members = [
    "crates/huncho-core",
    "crates/huncho-backend",
    "crates/huncho-hub",
    "crates/huncho-api",
    "crates/huncho-cli",
]
exclude = ["vendor/candle-kernels"]

[patch.crates-io]
# Candle 0.11 redeclares CUDA's FP16 min/max intrinsics when targeting Turing.
candle-kernels = { path = "vendor/candle-kernels" }

[workspace.package]
version = "0.1.0"
edition = "2021"
# No rust-version pin: transitive deps (icu edition2024, konst/redb >=1.89,
# xet-core round_char_boundary) force an ever-rising floor, so any fixed MSRV
# would be false. This is an application, not a published library.
license = "Apache-2.0"
repository = "https://github.com/grafuls/huncho"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
subtle = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "request-id"] }
http = "1"
# default-features disabled drops the `protobuf` feature (and the vulnerable
# protobuf 2.x crate, RUSTSEC-2024-0437); /metrics serves the text format only.
prometheus = { version = "0.13", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
bytes = "1"
futures = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
